[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlens"
version = "0.1.0"
description = "GPT-2 small inference engine from scratch in PyTorch for quantization experiments"
readme = "SPEC.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "transformers",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
